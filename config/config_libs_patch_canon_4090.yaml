# =============================================================================
# spectral_patch with CANONICAL input — RTX 4090
# =============================================================================
# = config_libs_patch_4090.yaml with model.patch.preprocess: canonical: real maps and
# synthetic spectra both go through data.canonical.patch_input (per-channel baseline, the
# real noise floor as detection limit, laser line blanked, L1 over unsaturated pixels,
# per-pixel saturation mask), so the model never sees the noise/continuum that only real
# spectra have. Needs a full-well data config (generation.detector.output_units: full_well):
#   uv run python train_finetune.py --config config/config_libs_patch_canon_4090.yaml \
#     --libs_data_config config/libs_data_minerals_avantes_fw.yaml --task classification --pool cls_mean
# Linear screen (scripts/eval_tima_transfer.py screen, Mar1A, 24 slabs): all-63 source-only
# interior macro recall 0.000 (as-is) -> 0.46-0.51 (canonical). Smoke: config_libs_patch_canon_smoke.yaml
# =============================================================================

data:
  n_bins: 2048           # overridden by the wavelength axis length
  n_classes: 10          # overridden from libs_data downstream settings
  n_elements: 60
  n_concentration_bins: 1000
  synthetic:
    val_fraction: 0.15

model:
  embedding_type: spectral_patch
  d_model: 128
  n_heads: 8
  n_layers: 6
  d_ff: 512
  dropout: 0.1
  max_seq_len: 8192      # unused by spectral_patch (tokens = windows)
  patch:
    preprocess: canonical  # data/canonical.py: remove the nuisance of real spectra from both domains
    canonical:             # constants of data.canonical.canonicalise (recorded in run_info)
      baseline_method: median           # block-median baseline at the noise mean (runmin = screen reference)
      baseline_nm: 2.0
      noise_sigma_counts: [3.2, 9.5, 48.5]  # per detector channel, Mar1A rock (eval_tima_transfer measure_nuisance)
      k_sigma: 3.0                      # soft noise floor = the real detection limit, applied to both domains
      blank_nm: [[265.4, 267.0]]        # scattered 266 nm laser line
      saturation_fw: 0.99               # per-pixel saturation mask (the embedding's flag channel)
    window_nm: 1.0
    stride_nm: 0.5
    n_samples: 48
    input_scale: 1.0       # canonical spectra: mean pixel 1, asinh(x / 1.0)
    pe_scale: 3000.0
    pe_wl_min: 180.0
    pe_wl_max: 900.0

pretrain:
  loss: mse              # spectral_patch supports mse only (window reconstruction)
  mask_ratio: 0.3        # fraction of windows masked
  mask_span_tokens: 3    # consecutive windows per span (1.5 nm of new signal + overlap)
  batch_size: 4
  accumulate_grad_batches: 8
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_epochs: 1
  min_lr: 1.0e-6

finetune:
  batch_size: 4
  epochs: 20
  warmup_epochs: 1
  learning_rate: 1.0e-3   # 5e-5 underfits: minerals_avantes classification 79 -> 99.6 % (line tokens), 44.5 -> 98.6 % (spectral_patch)
  weight_decay: 0.01
  freeze_encoder: false

logging:
  logger: tensorboard
  log_every_n_steps: 25
  val_check_interval: 1.0

device:
  accelerator: gpu
  precision: bf16-mixed
