# Smoke variant of config/config_libs_patch_canon_4090.yaml (tiny trunk, 2 epochs); pair with
# config/libs_data_minerals_avantes_fw_smoke.yaml.

data:
  n_bins: 2048           # overridden by the wavelength axis length
  n_classes: 5           # overridden from libs_data downstream settings
  synthetic:
    val_fraction: 0.2

model:
  embedding_type: spectral_patch
  d_model: 32
  n_heads: 2
  n_layers: 1
  d_ff: 64
  dropout: 0.0
  max_seq_len: 8192      # unused by spectral_patch
  patch:
    preprocess: canonical  # data/canonical.py: remove the nuisance of real spectra from both domains
    canonical:             # constants of data.canonical.canonicalise (recorded in run_info)
      baseline_method: median           # block-median baseline at the noise mean (runmin = screen reference)
      baseline_nm: 2.0
      noise_sigma_counts: [3.2, 9.5, 48.5]  # per detector channel, Mar1A rock (eval_tima_transfer measure_nuisance)
      k_sigma: 3.0                      # soft noise floor = the real detection limit, applied to both domains
      blank_nm: [[265.4, 267.0]]        # scattered 266 nm laser line
      saturation_fw: 0.99               # per-pixel saturation mask (the embedding's flag channel)
    window_nm: 1.0
    stride_nm: 0.5
    n_samples: 48
    input_scale: 1.0       # canonical spectra: mean pixel 1, asinh(x / 1.0)
    pe_scale: 3000.0
    pe_wl_min: 180.0
    pe_wl_max: 900.0

pretrain:
  loss: mse
  mask_ratio: 0.3
  mask_span_tokens: 3
  batch_size: 8
  epochs: 2
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_epochs: 1
  min_lr: 1.0e-6

finetune:
  batch_size: 8
  epochs: 2
  learning_rate: 1.0e-3   # 5e-5 underfits: minerals_avantes classification 79 -> 99.6 % (line tokens), 44.5 -> 98.6 % (spectral_patch)
  weight_decay: 0.01
  freeze_encoder: false

logging:
  logger: "tensorboard"
  log_every_n_steps: 1
  val_check_interval: 1.0

device:
  accelerator: "gpu"
  precision: "32"
