# =============================================================================
# Raw-spectrum window embedding (embedding_type: spectral_patch) — RTX 4090
# =============================================================================
# Same transformer trunk, batch sizes and learning rates as config_libs_cf_4090.yaml,
# but a fit-free input (models/spectral_patch_embedding.py): the unit-normalised
# spectrum is read through overlapping windows (1 nm wide, every 0.5 nm, 48 samples
# each, linear interpolation on the stitched detector axis), asinh-scaled, plus a
# saturation flag per sample; one Linear per window + detector-segment embedding +
# sinusoidal PE of the window centre (nm). No line dictionary, Voigt fits or token
# caches; --line_embedding_config is rejected.
# Pretraining: masked-window reconstruction (MSE on asinh intensities, span masks
# drawn on the GPU). cf_quantification is not supported (it needs per-line tokens).
#
#   uv run python train_pretrain.py --config config/config_libs_patch_4090.yaml \
#     --libs_data_config config/libs_data_minerals_avantes.yaml --experiment_name minerals_patch
#   uv run python train_finetune.py --config config/config_libs_patch_4090.yaml \
#     --libs_data_config config/libs_data_minerals_avantes.yaml \
#     --pretrain_run_dir runs/pretrain_<ts>_minerals_patch --task classification --pool cls_mean
# Smoke variant: config/config_libs_patch_smoke.yaml
# =============================================================================

data:
  n_bins: 2048           # overridden by the wavelength axis length
  n_classes: 10          # overridden from libs_data downstream settings
  n_elements: 60
  n_concentration_bins: 1000
  synthetic:
    val_fraction: 0.15

model:
  embedding_type: spectral_patch
  d_model: 128
  n_heads: 8
  n_layers: 6
  d_ff: 512
  dropout: 0.1
  max_seq_len: 8192      # unused by spectral_patch (tokens = windows)
  patch:
    window_nm: 1.0       # window width; > stride so lines on a border are seen whole
    stride_nm: 0.5       # centres on the global grid k * 0.5 nm (~1,000 tokens on 188.7-689.1 nm)
    n_samples: 48        # samples per window (0.021 nm, the UV pixel spacing)
    input_scale: 1.0e-2  # asinh(x / 0.01): linear below 1 % of the peak, log above
    saturation_level: 0.999
    min_saturated_px: 3  # >= 3 pixels at the maximum = clipped spectrum
    pe_scale: 3000.0     # finest PE frequency 3000 / 720 nm = 4.2 rad/nm
    pe_wl_min: 180.0     # fixed PE reference range (instrument independent)
    pe_wl_max: 900.0

pretrain:
  loss: mse              # spectral_patch supports mse only (window reconstruction)
  mask_ratio: 0.3        # fraction of windows masked
  mask_span_tokens: 3    # consecutive windows per span (1.5 nm of new signal + overlap)
  batch_size: 4
  accumulate_grad_batches: 8
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_epochs: 1
  min_lr: 1.0e-6

finetune:
  batch_size: 4
  epochs: 20
  warmup_epochs: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  freeze_encoder: false

logging:
  logger: tensorboard
  log_every_n_steps: 25
  val_check_interval: 1.0

device:
  accelerator: gpu
  precision: bf16-mixed
